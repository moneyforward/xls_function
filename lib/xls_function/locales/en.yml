en:
  xls_function:
    descriptions:
      abs: ABS(number) Returns the absolute value of a number, that is, the number without its sign.
      and: AND(condition1, [condition2], ...) Returns TRUE if all conditions are TRUE, and FALSE if any of them is FALSE. Conditions are checked from left to right, and the remaining conditions are not evaluated once a FALSE is found.
      asc: ASC(text) Converts full-width letters, digits, symbols, spaces, and katakana to half-width.
      char: CHAR(number) Returns the ASCII character for a character code (0-127). Use UNICHAR for Unicode characters such as Japanese.
      clean: CLEAN(text) Removes control characters that are not displayed on screen, such as line breaks and tabs, from text.
      code: CODE(text) Returns the character code (Unicode code point) of the first character as a number.
      concat: CONCAT(text1, [text2], ...) Joins multiple strings into one string.
      datevalue: DATEVALUE(date_text) Converts a date string such as "2026/10/19" to a value that can be calculated as a date (serial number).
      date: DATE(year, month, day) Creates a date (serial number) from year, month, and day numbers. If the month or day is out of range, it carries over to the following month or day.
      day: DAY(date) Returns the day of a date as an integer from 1 to 31. The date can be a date value or a string such as "2026/10/19".
      dbcs: DBCS(text) Converts half-width uppercase letters, digits, and katakana to full-width.
      edate: EDATE(start_date, months) Returns the date (serial number) on the same day the specified number of months after the start date (before it if negative). If that day does not exist, the last day of the month is returned.
      eomonth: EOMONTH(start_date, months) Returns the last day of the month (serial number) the specified number of months after the start date (before it if negative). Useful for calculating due dates such as "end of next month".
      exact: EXACT(text1, text2) Returns TRUE if the two strings match exactly, and FALSE otherwise. Uppercase and lowercase letters are distinguished.
      find: FIND(find_text, within_text, [start_num]) Searches within_text for find_text and returns the position where it is first found, counting from the beginning. Each character counts as 1, whether full-width or half-width. Returns an error if it is not found.
      fixed: FIXED(number, [decimals], [no_commas]) Rounds a number to the specified number of decimals (2 if omitted) and returns it as text with a comma every 3 digits. If no_commas is TRUE, commas are not added.
      hour: HOUR(time) Returns the hour of a time as an integer from 0 to 23. The time can be a time value or a string such as "13:30".
      if: IF(condition, value_if_true, value_if_false) Returns value_if_true if the condition is TRUE, and value_if_false if it is FALSE. Specify all three arguments.
      ifs: IFS(condition1, value1, [condition2, value2], ...) Checks the conditions in order and returns the value for the first condition that is TRUE. Returns empty if no condition is TRUE. Lets you write multiple branches without nesting IF.
      int: INT(number) Removes the decimal part to make an integer. Negative numbers become the smaller integer.
      iserror: ISERROR(value) Returns TRUE if the value is an error, and FALSE otherwise. Combined with IF, you can return a different value when an error occurs.
      isnumber: ISNUMBER(value) Returns TRUE if the value is a number, and FALSE otherwise. A string containing only digits is not treated as a number and returns FALSE.
      lambda: LAMBDA([parameter1, parameter2, ...], calculation) Defines a reusable custom function. *This function is for internal use. Do not use it directly in formulas.
      left: LEFT(text, num_chars) Returns the specified number of characters from the beginning of the text. num_chars cannot be omitted.
      len: LEN(text) Returns the number of characters in the text. Full-width and half-width characters each count as 1.
      let: LET(name1, value1, [name2, value2, ...], calculation) Assigns names to values or intermediate results so they can be used in the final calculation. Saves you from writing the same calculation more than once.
      lower: LOWER(text) Converts all letters to lowercase.
      mid: MID(text, start_num, num_chars) Returns the specified number of characters starting at start_num (the first character is 1).
      minute: MINUTE(time) Returns the minute of a time as an integer from 0 to 59.
      month: MONTH(date) Returns the month of a date as an integer from 1 to 12.
      not: NOT(logical) Changes TRUE to FALSE and FALSE to TRUE.
      now: NOW() Returns the current date and time as a serial number.
      or: OR(condition1, [condition2], ...) Returns TRUE if any condition is TRUE, and FALSE if all are FALSE. Conditions are checked from left to right, and the remaining conditions are not evaluated once a TRUE is found.
      power: POWER(number, power) Returns the number raised to the power.
      proper: PROPER(text) Capitalizes the first letter of each word and converts all other letters to lowercase.
      replace: REPLACE(old_text, start_num, num_chars, new_text) Replaces the specified number of characters starting at start_num with new_text. Unlike SUBSTITUTE, it replaces by position rather than by matching text.
      rept: REPT(text, number_times) Returns the text repeated the specified number of times. Returns an empty string if number_times is 0.
      right: RIGHT(text, num_chars) Returns the specified number of characters from the end of the text. num_chars cannot be omitted.
      rounddown: ROUNDDOWN(number, num_digits) Rounds a number down to the specified number of digits. num_digits 0 gives an integer, 1 gives one decimal place, and -3 gives units of 1,000.
      roundup: ROUNDUP(number, num_digits) Rounds a number up to the specified number of digits. num_digits 0 gives an integer, 1 gives one decimal place, and -3 gives units of 1,000.
      round: ROUND(number, num_digits) Rounds a number to the specified number of digits. num_digits 0 gives an integer, 1 gives one decimal place, and -3 gives units of 1,000.
      second: SECOND(time) Returns the second of a time as an integer from 0 to 59.
      sign: SIGN(number) Returns the sign of a number. Returns 1 if it is positive, 0 if it is 0, and -1 if it is negative.
      sqrt: SQRT(number) Returns the positive square root. Returns an error if the number is negative.
      substitute: SUBSTITUTE(text, old_text, new_text, [instance_num]) Replaces old_text in the text with new_text. If instance_num is specified, only that occurrence is replaced (all occurrences if omitted).
      text: TEXT(value, format_text) Converts a number or date to text in a display format such as "#,##0" or "yyyy/mm/dd".
      time: TIME(hour, minute, second) Creates a time (serial number) from hour, minute, and second numbers.
      timevalue: TIMEVALUE(time_text) Converts a time string such as "13:30" to a value that can be calculated as a time (serial number).
      today: TODAY() Returns the current date as a serial number.
      trim: TRIM(text) Removes leading and trailing spaces, and collapses consecutive spaces within the text into one. Full-width spaces are included.
      trunc: TRUNC(number, [num_digits]) Truncates a number to the specified number of digits. If num_digits is omitted, returns an integer.
      unichar: UNICHAR(number) Returns the character for the given Unicode code point (number).
      unicode: UNICODE(text) Returns the Unicode code point of the first character as a number.
      upper: UPPER(text) Converts all letters to uppercase.
      value: VALUE(text) Converts a string that represents a number to a number. Strings with commas such as "1,234" can also be converted.
      year: YEAR(date) Returns the year of a date as an integer.
      switch: SWITCH(expression, value1, result1, [value2, result2, ...], [default]) Compares the expression with value1, value2, ... in order and returns the result for the first matching value. If nothing matches, returns the default given as the last argument, or an error if no default is given.
    errors:
      out_of_range: Value is out of range. %{value}
      missing_target: Missing %{target} in %{source}.
      number_is_negative: "%{label} is negative. %{number}"
      cannot_convert_to_number: Cannot convert %{source} to number.
      cannot_convert_to_date: Cannot convert %{source} to date.
      cannot_convert_to_time: Cannot convert %{source} to time.
      cannot_divide_by_zero: "Cannot divide by zero."
      invalid_value_for_function: Invalid value for formula or function.
      missing_value_for_function: "'Value to return if no matching value' is not specified."
