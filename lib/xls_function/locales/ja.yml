ja:
  xls_function:
    descriptions:
      abs: ABS(数値) 数値の符号を取り除いた絶対値を返します。
      and: AND(条件1, [条件2], ...) すべての条件が TRUE のとき TRUE を、1つでも FALSE があれば FALSE を返します。左から順に調べ、FALSE が見つかった時点で残りの条件は評価しません。
      asc: ASC(文字列) 全角の英数字・記号・スペース・カタカナを半角に変換します。
      char: CHAR(数値) 文字コード（0～127）に対応する ASCII 文字を返します。日本語などの Unicode 文字には UNICHAR を使ってください。
      clean: CLEAN(文字列) 改行やタブなど、画面に表示されない制御文字を文字列から取り除きます。
      code: CODE(文字列) 先頭の1文字の文字コード（Unicode のコードポイント）を数値で返します。
      concat: CONCAT(文字列1, [文字列2], ...) 複数の文字列をつなげて1つの文字列にします。
      datevalue: DATEVALUE(日付文字列) "2026/10/19" のような日付の文字列を、日付として計算できる値（シリアル値）に変換します。
      date: DATE(年, 月, 日) 年・月・日の数値から日付（シリアル値）を作ります。月や日が範囲を超えた場合は翌月・翌日に繰り越されます。
      day: DAY(日付) 日付の「日」を 1～31 の整数で返します。日付には日付の値のほか、"2026/10/19" のような文字列も指定できます。
      dbcs: DBCS(文字列) 半角の英大文字・数字・カタカナを全角に変換します。
      edate: EDATE(開始日, 月数) 開始日から指定した月数だけ後（負の数なら前）の同じ日の日付（シリアル値）を返します。その日が存在しない場合は月末日になります。
      eomonth: EOMONTH(開始日, 月数) 開始日から指定した月数だけ後（負の数なら前）の月の末日（シリアル値）を返します。「翌月末」などの支払期日の計算に使えます。
      exact: EXACT(文字列1, 文字列2) 2つの文字列が完全に一致すれば TRUE、そうでなければ FALSE を返します。英字の大文字・小文字は区別します。
      find: FIND(検索文字列, 対象, [開始位置]) 対象の文字列の中から検索文字列を探し、最初に見つかった位置を先頭から数えた番号で返します。全角・半角に関係なく1文字を1と数えます。見つからない場合はエラーになります。
      fixed: FIXED(数値, [桁数], [桁区切りなし]) 数値を指定した桁数（省略時は2）に四捨五入し、3桁ごとにカンマを入れた文字列にします。桁区切りなしに TRUE を指定するとカンマを付けません。
      hour: HOUR(時刻) 時刻の「時」を 0～23 の整数で返します。時刻には時刻の値のほか、"13:30" のような文字列も指定できます。
      if: IF(条件, 条件が真の場合の値, 条件が偽の場合の値) 条件が TRUE なら真の場合の値を、FALSE なら偽の場合の値を返します。3つの引数はすべて指定してください。
      ifs: IFS(条件1, 値1, [条件2, 値2], ...) 条件を先頭から順に調べ、最初に TRUE になった条件に対応する値を返します。どの条件も TRUE にならない場合は空になります。IF を入れ子にせずに複数の条件分岐を書けます。
      int: INT(数値) 小数点以下を切り捨てて整数にします。負の数はより小さい整数になります。
      iserror: ISERROR(値) 値がエラーなら TRUE、そうでなければ FALSE を返します。IF と組み合わせると、エラー時に別の値を返せます。
      isnumber: ISNUMBER(値) 値が数値なら TRUE、そうでなければ FALSE を返します。数字だけの文字列は数値とみなされず FALSE になります。
      lambda: LAMBDA([引数1, 引数2, ...], 計算式) 再利用できる独自の関数を定義します。※ 内部利用のための関数です。式の中で直接使わないでください。
      left: LEFT(文字列, 文字数) 文字列の先頭から指定した文字数分を取り出します。文字数は省略できません。
      len: LEN(文字列) 文字列の文字数を返します。全角・半角とも1文字と数えます。
      let: LET(名前1, 値1, [名前2, 値2, ...], 計算式) 値や途中の計算結果に名前を付け、最後の計算式の中でその名前を使えるようにします。同じ計算を何度も書かずに済みます。
      lower: LOWER(文字列) 英字をすべて小文字にします。
      mid: MID(文字列, 開始位置, 文字数) 文字列の開始位置（先頭が1）から指定した文字数分を取り出します。
      minute: MINUTE(時刻) 時刻の「分」を 0～59 の整数で返します。
      month: MONTH(日付) 日付の「月」を 1～12 の整数で返します。
      not: NOT(論理値) TRUE を FALSE に、FALSE を TRUE に反転します。
      now: NOW() 現在の日付と時刻をシリアル値で返します。
      or: OR(条件1, [条件2], ...) いずれかの条件が TRUE なら TRUE を、すべて FALSE なら FALSE を返します。左から順に調べ、TRUE が見つかった時点で残りの条件は評価しません。
      power: POWER(数値, 指数) 数値を指数乗した値を返します。
      proper: PROPER(文字列) 英単語の先頭の文字を大文字に、それ以外の英字を小文字にします。
      replace: REPLACE(文字列, 開始位置, 文字数, 置換文字列) 文字列の開始位置から指定した文字数分を置換文字列に置き換えます。文字ではなく位置で置き換える点が SUBSTITUTE と異なります。
      rept: REPT(文字列, 繰り返し回数) 文字列を指定した回数くり返した文字列を返します。回数が 0 のときは空文字列になります。
      right: RIGHT(文字列, 文字数) 文字列の末尾から指定した文字数分を取り出します。文字数は省略できません。
      rounddown: ROUNDDOWN(数値, 桁数) 数値を指定した桁数で切り捨てます。桁数 0 で整数、1 で小数第1位、-3 で千円単位になります。
      roundup: ROUNDUP(数値, 桁数) 数値を指定した桁数で切り上げます。桁数 0 で整数、1 で小数第1位、-3 で千円単位になります。
      round: ROUND(数値, 桁数) 数値を指定した桁数で四捨五入します。桁数 0 で整数、1 で小数第1位、-3 で千円単位になります。
      second: SECOND(時刻) 時刻の「秒」を 0～59 の整数で返します。
      sign: SIGN(数値) 数値の符号を返します。正の数なら 1、0 なら 0、負の数なら -1 です。
      sqrt: SQRT(数値) 正の平方根を返します。負の数を指定するとエラーになります。
      substitute: SUBSTITUTE(文字列, 検索文字列, 置換文字列, [置換対象]) 文字列に含まれる検索文字列を置換文字列に置き換えます。置換対象に数値を指定すると、その順番に現れたものだけを置き換えます（省略時はすべて）。
      text: TEXT(値, 表示形式) 数値や日付を、"#,##0" や "yyyy/mm/dd" のような表示形式の文字列に変換します。
      time: TIME(時, 分, 秒) 時・分・秒の数値から時刻（シリアル値）を作ります。
      timevalue: TIMEVALUE(時刻文字列) "13:30" のような時刻の文字列を、時刻として計算できる値（シリアル値）に変換します。
      today: TODAY() 現在の日付をシリアル値で返します。
      trim: TRIM(文字列) 先頭と末尾のスペースを削除し、文字列の途中に連続するスペースは1つにまとめます。全角スペースも対象です。
      trunc: TRUNC(数値, [桁数]) 数値を指定した桁数で切り捨てます。桁数を省略すると整数になります。
      unichar: UNICHAR(数値) Unicode のコードポイント（数値）に対応する文字を返します。
      unicode: UNICODE(文字列) 先頭の1文字の Unicode コードポイントを数値で返します。
      upper: UPPER(文字列) 英字をすべて大文字にします。
      value: VALUE(文字列) 数値を表す文字列を数値に変換します。"1,234" のようにカンマが含まれていても変換できます。
      year: YEAR(日付) 日付の「年」を整数で返します。
      switch: SWITCH(式, 値1, 結果1, [値2, 結果2, ...], [一致しない場合の結果]) 式の値を値1、値2…と順に比べ、最初に一致した値に対応する結果を返します。どれにも一致しないときは最後に指定した「一致しない場合の結果」を返し、それも指定されていなければエラーになります。
    errors:
      out_of_range: 範囲外の値が指定されています。%{value}
      missing_target: 文字列%{source}中に%{target}が見つかりません。
      number_is_negative: "%{label}が負の値になっています。%{number}"
      cannot_convert_to_number: "%{source}は数値に変換できません。"
      cannot_convert_to_date: "%{source}は日付に変換できません。"
      cannot_convert_to_time: "%{source}は時刻に変換できません。"
      cannot_divide_by_zero: "0除算が発生しました。"
      invalid_value_for_function: 値が数式または関数に対して無効です。
      missing_value_for_function: 一致する値がない場合に返す値が指定されていません。
